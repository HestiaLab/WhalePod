openapi: 3.1.0
info:
  title: WhalePod（鲸群）API 契约
  version: 0.1.0
  summary: 邀请制技术社区的公开读写 API 与本机 AI 审核 Agent API
  description: |
    WhalePod v0.1.0 交付版 HTTP 契约，需求基线为 `docs/SRS.md` v0.1.0（REQ-I-006、REQ-I-009）。验收状态与生产前置条件见 `docs/design/acceptance.md` 与 `docs/design/production-readiness.md`。

    ## 统一约定
    - 所有成功响应为 `{ "data": ... }`；失败响应为 `{ "code": "...", "message": "...", "details": ... }`。
    - 错误码取自 SRS 附录 C；`429` 响应必须带 `Retry-After` 头。
    - 分页使用 `cursor` + `limit`，`limit` 默认 20、最大 50；排序在服务端执行。
    - 公开读接口允许匿名访问；登录后可使用 Cookie 会话读取自己的待审/驳回内容（`GET /me/posts`、`GET /me/comments` 只返回本人内容，不含 `hidden/deleted`）。
    - 写操作必须服务端校验登录、角色、账号状态（muted/banned）与资源所有权（REQ-F-007）；被禁言账号可读/举报，但不能发帖、评论、点赞（REQ-F-005）。
    - `/api/v1` 写接口按已认证用户分区限流（默认 60 次/60 秒，可配置）；超限返回 `429 RATE_LIMITED`、`details.retryAfterSeconds` 与 `Retry-After`。公开只读 `GET` 不受写限流影响。
    - JSON 写请求体默认上限 8 MiB（可配置）；超限返回 `400 VALIDATION_FAILED`，`details.reason=body_too_large`，请求不会进入业务服务。
    - 帖子/评论编辑与评论删除使用 `If-Match`（ETag 形如 `"v12"`）防止并发覆盖；版本冲突返回 `409 CONFLICT`。
    - 内容创建可能进入 `pending` 审核；响应体中的 `moderationStatus` 表示真实状态，公开页面/搜索/RSS 只展示 `approved`（REQ-F-026、REQ-F-060）。
    - 公开出口不暴露邮箱、GitHub ID、举报人身份、设备私钥或服务令牌。

    ## 安全
    - 浏览器使用 `cookieAuth`（HttpOnly + Secure + SameSite=Lax 会话 Cookie），所有非安全方法必须携带 `X-CSRF-Token` 防伪头。
    - 浏览器客户端登录后调用 `GET /auth/csrf` 获取请求令牌；响应会同时下发 `whalepod_csrf` 防伪 Cookie。Web 与 API 共享 Data Protection 密钥目录，因此 Web 登录会话可直接用于 API。
    - `/agent/*` 只接受 `serviceBearer`（`Authorization: Bearer <service-token>`），不接受 Cookie；scope 为 `moderation:read`、`moderation:suggest`、`agent:heartbeat`。
    - Agent API 仅由维护者本机出站轮询，不开放入站回调；响应 `Cache-Control: no-store`。

    ## AI 审核边界
    - AI/MCP 默认关闭；关闭时 `/agent/*` 返回 `503 AGENT_DISABLED`，内容全人工审核（REQ-F-143）。
    - `ai.suggestions_paused=true` 时仅 claim/suggestion 返回 `503 AGENT_DISABLED`；heartbeat/policy/只读仍可用并返回 `suggestionsPaused=true`（REQ-F-132 AC6、REQ-F-143）。
    - Agent 建议只写入建议记录，**不改变内容审核状态**；当前版本不提供自动通过/驳回动作。最终裁决只能由管理员的人工操作完成（审核动作、举报处理或内容删除）；`/agent/*` 不提供任何裁决动作（REQ-F-131、REQ-F-132）。
    - 本机 stdio MCP 不是 HTTP 端点，本契约不提供 `/mcp`；MCP 工具经 Agent API 执行（REQ-I-010）。
  contact:
    name: WhalePod 维护者
    url: https://github.com/HestiaLab/WhalePod
  license:
    name: 专有（本版本未开源，不添加许可证文件）
    identifier: LicenseRef-WhalePod-Proprietary
servers:
  - url: https://api.dev.whalepod.invalid/api/v1
    description: 开发/预览环境占位地址（`.invalid` 为保留 TLD，仅示意；实际地址由部署配置注入，禁止作为生产运行时）
  - url: https://api.whalepod.invalid/api/v1
    description: 生产环境占位地址（`.invalid` 为保留 TLD，仅示意；上线前替换为已备案的腾讯云域名）
security: []
tags:
  - name: 认证
    description: 浏览器会话 CSRF 令牌获取（REQ-I-006）
  - name: 信息流与帖子
    description: 公开信息流、帖子详情、创建/编辑/删除与分类浏览（REQ-F-021～REQ-F-028、REQ-F-032～REQ-F-035）
  - name: 评论与互动
    description: 评论、点赞、采纳答案与举报（REQ-F-050～REQ-F-055、REQ-F-028）
  - name: 搜索与标签
    description: 关键词搜索、标签聚合（REQ-F-080～REQ-F-082）
  - name: 用户
    description: 公开用户主页与公开帖子（REQ-F-083、REQ-F-016）
  - name: 我的内容
    description: 当前登录用户自己的帖子/评论视图，含待审与驳回（REQ-F-026）
  - name: 上传
    description: 帖子图片上传（REQ-F-036、REQ-I-003）
  - name: 通知
    description: 站内通知列表与已读（REQ-F-071～REQ-F-073、REQ-F-076）
  - name: 设备验证
    description: Ed25519 challenge 生成、验签完成、设备列表与撤销（REQ-F-090～REQ-F-101、附录 A）
  - name: 管理后台 - 审核
    description: 待审队列与人工裁决；只有管理员可调用（REQ-F-060～REQ-F-062、REQ-F-111、REQ-F-132）
  - name: 管理后台 - 举报
    description: 举报队列与处理（REQ-F-064、REQ-F-112）
  - name: 管理后台 - 用户
    description: 用户查询、账号状态与信任等级（REQ-F-005、REQ-F-014、REQ-F-065、REQ-F-113）
  - name: 管理后台 - 邀请码
    description: 邀请码创建、停用与使用情况（REQ-F-011、REQ-F-012、REQ-F-114）
  - name: 管理后台 - 分类
    description: 板块创建/编辑/停用（REQ-F-020、REQ-F-115）
  - name: 管理后台 - 审计
    description: 审计日志查询（REQ-F-067、REQ-F-116）
  - name: Agent API
    description: 本机 AI 审核 Agent 的任务、租约、建议、心跳与策略；Bearer 服务令牌 + 最小 scope（REQ-F-129～REQ-F-143、REQ-I-009）

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: whalepod_session
      description: |
        浏览器会话 Cookie（名称可配置，示例为 `whalepod_session`）。必须设置 `HttpOnly`、`Secure`、`SameSite=Lax`（REQ-NF-005）。
        所有非安全方法（POST/PATCH/DELETE）还必须携带 `X-CSRF-Token`，服务端执行双提交 Cookie + Origin/Referer 校验；失败返回 `403 FORBIDDEN`。
        登录后通过 `GET /auth/csrf` 获取请求令牌与 `whalepod_csrf` 防伪 Cookie（与 Web 共享 Data Protection 密钥）。
        未兑换邀请码的待激活账号（`ActivatedAt IS NULL`）只能访问激活页；所有成员写接口返回 `403 FORBIDDEN`，`details.reason=activation_required`（REQ-F-003）。
        只读模式/关闭登录时，写接口返回 `403 FORBIDDEN`，`details.reason=read_only` 或 `login_disabled`（REQ-F-008）；页面与 API 行为一致。
        不得把会话或访问令牌保存到浏览器 `localStorage`（SRS §2.5）。
    serviceBearer:
      type: http
      scheme: bearer
      bearerFormat: opaque
      description: |
        AI 审核 Agent 专用服务令牌，仅对应一个非交互服务账号；不接受 Cookie。
        scope 仅允许 `moderation:read`、`moderation:suggest`、`agent:heartbeat`，不得授予用户管理、处罚、内容裁决、策略修改或全量审计权限（REQ-F-136、REQ-I-009）。
        `moderation:read` 用于任务列表/详情/策略读取；`moderation:suggest` 用于领取、释放与提交建议（避免只读令牌占用任务）；`agent:heartbeat` 仅用于心跳。
        除心跳外，Agent 变更/读取任务时必须携带 `X-Agent-Instance-Id`，服务端校验实例归属与 active 状态，防止跨实例领取/释放/伪造归属。
        令牌只存哈希，支持过期、轮换、撤销与最后使用时间；不得出现在 URL、日志或前端。令牌无效/过期/撤销分别返回 `SERVICE_TOKEN_INVALID/EXPIRED/REVOKED`，scope 不足返回 `SCOPE_DENIED`。
  parameters:
    Limit:
      name: limit
      in: query
      required: false
      description: 每页数量，默认 20，最大 50（SRS §4.6）。
      schema:
        type: integer
        minimum: 1
        maximum: 50
        default: 20
    Cursor:
      name: cursor
      in: query
      required: false
      description: 不透明游标，只能使用上一页响应中的 `nextCursor`；为空表示第一页。
      schema:
        type: string
        maxLength: 512
    CsrfToken:
      name: X-CSRF-Token
      in: header
      required: true
      description: 防伪令牌（与 CSRF Cookie 双提交）。所有浏览器写操作必填，缺失或无效返回 `403 FORBIDDEN`。
      schema:
        type: string
        minLength: 16
        maxLength: 256
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: 编辑前从 `GET /posts/{postId}` 获得的 ETag，形如 `"v12"`。不匹配返回 `409 CONFLICT`，不静默覆盖（REQ-F-033 AC5）。
      schema:
        type: string
        pattern: '^"v[1-9][0-9]*"$'
        example: '"v12"'
    PostId:
      name: postId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CommentId:
      name: commentId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    DeviceId:
      name: deviceId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    NotificationId:
      name: notificationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ReportId:
      name: reportId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    UserId:
      name: userId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    InviteId:
      name: inviteId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CategoryId:
      name: categoryId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TaskId:
      name: taskId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    AgentInstanceId:
      name: X-Agent-Instance-Id
      in: header
      required: true
      description: 心跳返回的 Agent 实例 UUID。服务端校验实例属于当前服务账号且处于 active；claim/release/suggestion 必须由同一实例操作。
      schema:
        type: string
        format: uuid
    TargetType:
      name: targetType
      in: path
      required: true
      description: 被审核内容类型。
      schema:
        type: string
        enum: [post, comment]
    TargetId:
      name: targetId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  headers:
    RetryAfter:
      description: 建议重试等待秒数（REQ-NF-016、REQ-I-009）。
      required: true
      schema:
        type: integer
        minimum: 1
    ETag:
      description: 内容版本 ETag，编辑/删除时原样放入 `If-Match`；来自帖子或评论响应（帖子 `ETag` 头或评论 `version`）。
      schema:
        type: string
        example: '"v12"'
    CacheControl:
      description: Agent API 响应禁止缓存。
      schema:
        type: string
        const: no-store
  responses:
    BadRequest:
      description: 请求字段/状态校验失败（`VALIDATION_FAILED`、`INVITE_*`、`CHALLENGE_*`、`SIGNATURE_INVALID`、`TIMESTAMP_INVALID`、`PLATFORM_UNSUPPORTED`、`SUGGESTION_INVALID` 等）。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            validation:
              summary: 字段校验失败
              value:
                code: VALIDATION_FAILED
                message: 请求字段校验失败。
                details:
                  issues:
                    - field: title
                      message: 标题长度必须为 8–200 个字符。
    Unauthorized:
      description: 未登录（`AUTH_REQUIRED`）或服务令牌无效/过期/撤销。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            authRequired:
              summary: 需要登录
              value:
                code: AUTH_REQUIRED
                message: 请先登录后再进行此操作。
    Forbidden:
      description: 无权限、账号禁言/封禁、CSRF 失败、scope 不足或违反管理约束。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            accountMuted:
              summary: 账号被禁言
              value:
                code: ACCOUNT_MUTED
                message: 当前账号处于禁言状态，不能执行该写操作。
                details:
                  expiresAt: '2026-10-31T00:00:00Z'
            forbidden:
              summary: 无权限
              value:
                code: FORBIDDEN
                message: 没有权限执行此操作。
    NotFound:
      description: 目标不存在或不可见（含防枚举策略）。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            notFound:
              summary: 不存在或不可见
              value:
                code: NOT_FOUND
                message: 请求的内容不存在或当前不可见。
    Conflict:
      description: 并发冲突、重复绑定、版本过期或状态不允许。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            versionConflict:
              summary: 内容版本冲突
              value:
                code: CONFLICT
                message: 内容已被其他操作修改，请刷新后重试。
                details:
                  currentVersion: 13
                  expectedVersion: 12
    PayloadTooLarge:
      description: 上传文件超过 10 MB（`UPLOAD_TOO_LARGE`）。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    UnsupportedMediaType:
      description: 文件类型不支持，或包含 SVG/可执行文件（`UPLOAD_UNSUPPORTED_TYPE`）。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    RateLimited:
      description: 请求过于频繁（`RATE_LIMITED`）；按 `Retry-After` 等待。
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            limited:
              summary: 触发限流
              value:
                code: RATE_LIMITED
                message: 请求过于频繁，请稍后再试。
                details:
                  retryAfterSeconds: 60
    AgentRateLimited:
      description: Agent API 请求过于频繁或超出配额（`AGENT_RATE_LIMITED`）；按 `Retry-After` 等待。
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            limited:
              summary: Agent 限流
              value:
                code: AGENT_RATE_LIMITED
                message: Agent 请求过于频繁，请按 Retry-After 退避。
                details:
                  retryAfterSeconds: 120
    InternalError:
      description: 服务端错误（`INTERNAL`）；不包含敏感细节。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            internal:
              summary: 服务端错误
              value:
                code: INTERNAL
                message: 服务暂时不可用，请稍后重试。
    AgentDisabled:
      description: |
        AI/MCP 总开关关闭时，所有 `/agent/*` 返回 `AGENT_DISABLED`，MCP Server 不启动。
        `ai.suggestions_paused=true` 时仅 claim/suggestion 返回 `AGENT_DISABLED`；heartbeat、policy、任务列表/详情与 release 仍可用，并返回 `suggestionsPaused=true`（REQ-F-132 AC6、REQ-F-143）。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            disabled:
              summary: AI 功能关闭
              value:
                code: AGENT_DISABLED
                message: AI 审核已关闭，请转入全人工审核。
  schemas:
    ErrorCode:
      type: string
      description: SRS 附录 C 错误码目录；本契约不得引入未登记错误码。
      enum:
        - AUTH_REQUIRED
        - FORBIDDEN
        - NOT_FOUND
        - VALIDATION_FAILED
        - CONFLICT
        - RATE_LIMITED
        - ACCOUNT_MUTED
        - ACCOUNT_BANNED
        - INVITE_INVALID
        - INVITE_EXHAUSTED
        - INVITE_EXPIRED
        - CHALLENGE_NOT_FOUND
        - CHALLENGE_EXPIRED
        - CHALLENGE_USED
        - SIGNATURE_INVALID
        - TIMESTAMP_INVALID
        - PLATFORM_UNSUPPORTED
        - DEVICE_ALREADY_BOUND
        - DEVICE_LIMIT_REACHED
        - DEVICE_VERIFICATION_LOCKED
        - UPLOAD_TOO_LARGE
        - UPLOAD_UNSUPPORTED_TYPE
        - SERVICE_TOKEN_INVALID
        - SERVICE_TOKEN_EXPIRED
        - SERVICE_TOKEN_REVOKED
        - SCOPE_DENIED
        - TASK_NOT_FOUND
        - TASK_ALREADY_CLAIMED
        - TASK_LEASE_EXPIRED
        - CONTENT_VERSION_STALE
        - SUGGESTION_INVALID
        - TASK_ALREADY_DECIDED
        - AGENT_RATE_LIMITED
        - AGENT_DISABLED
        - INTERNAL
      example: VALIDATION_FAILED
    Error:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code:
          $ref: '#/components/schemas/ErrorCode'
        message:
          type: string
          description: 面向用户的中文错误信息；不得包含令牌、私钥、PII 或可枚举他人的细节。
        details:
          description: 结构化补充信息（字段错误、冲突版本、重试秒数等）；可为对象、数组或 null。
          oneOf:
            - type: object
              additionalProperties: true
            - type: array
              items: {}
            - type: 'null'
      example:
        code: VALIDATION_FAILED
        message: 请求字段校验失败。
        details:
          issues:
            - field: bodyMd
              message: 正文长度必须为 10–60,000 个字符。
    CsrfTokenResult:
      type: object
      additionalProperties: false
      required: [token, headerName, cookieName]
      properties:
        token:
          type: string
          description: 请求令牌；放入后续写请求的 `X-CSRF-Token` 头。与当前会话身份绑定，本端点需有效登录会话。
        headerName:
          type: string
          const: X-CSRF-Token
        cookieName:
          type: string
          const: whalepod_csrf

    DeviceBadge:
      type: object
      additionalProperties: false
      required: [verified, activeDeviceCount]
      properties:
        verified:
          type: boolean
          description: 是否至少有一台活跃设备；只证明密钥持有，不证明环境可信（REQ-F-100）。
        activeDeviceCount:
          type: integer
          minimum: 0
        lastVerifiedAt:
          type: [string, 'null']
          format: date-time
    Author:
      type: object
      additionalProperties: false
      required: [id, handle, displayName, trustLevel, badge]
      properties:
        id:
          type: string
          format: uuid
          description: 公开用户 UUID，可用于举报用户等稳定引用。
        handle:
          type: string
          example: alice
        displayName:
          type: string
          example: 海豚
        avatarUrl:
          type: [string, 'null']
          example: /media/avatars/example.webp
        trustLevel:
          type: integer
          minimum: 0
          maximum: 4
          example: 2
        badge:
          $ref: '#/components/schemas/DeviceBadge'
    Category:
      type: object
      additionalProperties: false
      required: [id, slug, name, displayOrder, status]
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
          example: reproducible
        name:
          type: string
          example: 踩坑实测
        description:
          type: [string, 'null']
          example: 带环境信息与复现步骤的实测记录
        displayOrder:
          type: integer
          example: 3
        status:
          type: string
          enum: [active, disabled]
          description: 公开接口只返回 active；停用板块的历史帖子仍可访问（REQ-F-020）。
    TagSummary:
      type: object
      additionalProperties: false
      required: [slug, name]
      properties:
        slug:
          type: string
          example: dsh
        name:
          type: string
          example: DSH
    Tag:
      type: object
      additionalProperties: false
      required: [id, slug, name, postCount]
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
          example: dsh
        name:
          type: string
          example: DSH
        postCount:
          type: integer
          minimum: 0
          description: 该标签下公开帖子数量（REQ-F-082）。
    Environment:
      type: object
      additionalProperties: false
      properties:
        kernelVersion:
          type: [string, 'null']
          maxLength: 64
          example: 6.8.0-45-generic
        platform:
          type: [string, 'null']
          enum: [win32-x64, win32-arm64, darwin-x64, darwin-arm64, linux-x64, linux-arm64, null]
          example: linux-x64
        model:
          type: [string, 'null']
          maxLength: 100
          example: deepseek-flash
    Artifact:
      type: object
      additionalProperties: false
      required: [id, kind, name, content, copyCount, sortOrder]
      properties:
        id:
          type: string
          format: uuid
        kind:
          type: string
          enum: [patch, yaml, json, bundle, markdown, shell]
          description: shell/patch 等高风险类型需展示“先审查再执行”的提示（REQ-F-042）。
        name:
          type: string
          maxLength: 120
          example: 修复启动脚本.patch
        note:
          type: [string, 'null']
          maxLength: 200
          example: 先备份原文件再应用
        content:
          type: string
          maxLength: 200000
          description: 纯文本产物；服务端不解析、不执行（REQ-F-043）。
        copyCount:
          type: integer
          minimum: 0
        sortOrder:
          type: integer
          minimum: 0
    PostImage:
      type: object
      additionalProperties: false
      required: [id, url, width, height, mimeType, sortOrder]
      properties:
        id:
          type: string
          format: uuid
        url:
          type: string
          description: 受控图片地址；不提供可遍历的对象存储路径（REQ-I-003）。
          example: /media/2026/10/example-post-image.webp
        width:
          type: integer
          minimum: 1
        height:
          type: integer
          minimum: 1
        altText:
          type: [string, 'null']
          maxLength: 200
        mimeType:
          type: string
          enum: [image/jpeg, image/png, image/webp, image/gif]
        sortOrder:
          type: integer
          minimum: 0
          description: 图片展示顺序；数组顺序与 sortOrder 一致（REQ-F-029）。
    PostCounts:
      type: object
      additionalProperties: false
      required: [views, copies, likes, comments, artifacts]
      properties:
        views:
          type: integer
          minimum: 0
        copies:
          type: integer
          minimum: 0
        likes:
          type: integer
          minimum: 0
        comments:
          type: integer
          minimum: 0
        artifacts:
          type: integer
          minimum: 0
    PostSummary:
      type: object
      additionalProperties: false
      required:
        - id
        - title
        - excerpt
        - category
        - author
        - tags
        - moderationStatus
        - isSolved
        - createdAt
        - lastActivityAt
        - counts
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
          minLength: 8
          maxLength: 200
        excerpt:
          type: string
          maxLength: 320
        category:
          $ref: '#/components/schemas/Category'
        author:
          $ref: '#/components/schemas/Author'
        tags:
          type: array
          maxItems: 6
          items:
            $ref: '#/components/schemas/TagSummary'
        moderationStatus:
          type: string
          enum: [pending, approved, rejected, hidden, deleted]
          description: 匿名公开出口只会出现 approved；作者在个人视图可见 pending/rejected（REQ-F-026）。
        isSolved:
          type: boolean
        acceptedCommentId:
          type: [string, 'null']
          format: uuid
        environment:
          $ref: '#/components/schemas/Environment'
        counts:
          $ref: '#/components/schemas/PostCounts'
        thumbnailUrl:
          type: [string, 'null']
          example: /media/2026/10/example-thumb.webp
        createdAt:
          type: string
          format: date-time
        lastActivityAt:
          type: string
          format: date-time
    PostDetail:
      type: object
      additionalProperties: false
      required:
        - id
        - title
        - excerpt
        - category
        - author
        - tags
        - moderationStatus
        - isSolved
        - createdAt
        - lastActivityAt
        - counts
        - bodyMd
        - bodyHtml
        - images
        - artifacts
        - updatedAt
        - version
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
          minLength: 8
          maxLength: 200
        excerpt:
          type: string
          maxLength: 320
        category:
          $ref: '#/components/schemas/Category'
        author:
          $ref: '#/components/schemas/Author'
        tags:
          type: array
          maxItems: 6
          items:
            $ref: '#/components/schemas/TagSummary'
        moderationStatus:
          type: string
          enum: [pending, approved, rejected, hidden, deleted]
          description: 匿名公开出口只会出现 approved；作者在个人视图可见 pending/rejected（REQ-F-026）。
        isSolved:
          type: boolean
        acceptedCommentId:
          type: [string, 'null']
          format: uuid
        environment:
          $ref: '#/components/schemas/Environment'
        counts:
          $ref: '#/components/schemas/PostCounts'
        thumbnailUrl:
          type: [string, 'null']
          example: /media/2026/10/example-thumb.webp
        createdAt:
          type: string
          format: date-time
        lastActivityAt:
          type: string
          format: date-time
        bodyMd:
          type: string
          minLength: 10
          maxLength: 60000
        bodyHtml:
          type: string
          description: 服务端清洗后的 HTML；禁止原始 HTML/脚本（REQ-F-035）。
        images:
          type: array
          maxItems: 10
          items:
            $ref: '#/components/schemas/PostImage'
        artifacts:
          type: array
          maxItems: 5
          items:
            $ref: '#/components/schemas/Artifact'
        updatedAt:
          type: string
          format: date-time
        version:
          type: integer
          minimum: 1
        latestModerationReason:
          type: [string, 'null']
          description: 最近一次驳回/隐藏理由；仅作者/管理员可见（REQ-F-041 AC1）。
    PostList:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PostSummary'
        nextCursor:
          type: [string, 'null']
    Comment:
      type: object
      additionalProperties: false
      required:
        - id
        - postId
        - author
        - moderationStatus
        - isAccepted
        - likeCount
        - isDeleted
        - version
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        postId:
          type: string
          format: uuid
        parentId:
          type: [string, 'null']
          format: uuid
        author:
          $ref: '#/components/schemas/Author'
        bodyMd:
          type: [string, 'null']
          description: 已删除评论不返回正文；保留占位以维持子评论归属（REQ-F-052 AC3）。
        bodyHtml:
          type: [string, 'null']
        moderationStatus:
          type: string
          enum: [pending, approved, rejected, hidden, deleted]
        isAccepted:
          type: boolean
        likeCount:
          type: integer
          minimum: 0
        isDeleted:
          type: boolean
        version:
          type: integer
          minimum: 1
          description: 评论内容版本；编辑时放入 ETag/If-Match（REQ-F-033 AC5）。
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    CommentList:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Comment'
        nextCursor:
          type: [string, 'null']
    LikeState:
      type: object
      additionalProperties: false
      required: [liked, likeCount]
      properties:
        liked:
          type: boolean
          description: 当前用户是否已点赞；重复提交相同状态为幂等成功（REQ-F-050 AC1）。
        likeCount:
          type: integer
          minimum: 0
    AcceptResult:
      type: object
      additionalProperties: false
      required: [postId, acceptedCommentId, isSolved]
      properties:
        postId:
          type: string
          format: uuid
        acceptedCommentId:
          type: [string, 'null']
          format: uuid
        isSolved:
          type: boolean
    UserStats:
      type: object
      additionalProperties: false
      required: [posts, comments, acceptedAnswers, likesReceived]
      properties:
        posts:
          type: integer
          minimum: 0
        comments:
          type: integer
          minimum: 0
        acceptedAnswers:
          type: integer
          minimum: 0
        likesReceived:
          type: integer
          minimum: 0
    UserProfile:
      type: object
      additionalProperties: false
      required: [id, handle, displayName, joinedAt, trustLevel, badge, stats]
      properties:
        id:
          type: string
          format: uuid
          description: 公开 UUID，用于举报用户等需要稳定标识的场景；不暴露邮箱或 GitHub ID。
        handle:
          type: string
          example: alice
        displayName:
          type: string
          example: 海豚
        bio:
          type: [string, 'null']
          maxLength: 500
        avatarUrl:
          type: [string, 'null']
          example: /media/avatars/example.webp
        joinedAt:
          type: string
          format: date-time
        trustLevel:
          type: integer
          minimum: 0
          maximum: 4
        badge:
          $ref: '#/components/schemas/DeviceBadge'
        stats:
          $ref: '#/components/schemas/UserStats'
        note:
          type: string
          description: 信任等级/设备徽章的口径说明，避免暗示“高等级一定正确”（REQ-F-016 AC3、REQ-F-100）。
    UserSearchItem:
      type: object
      additionalProperties: false
      required: [id, handle, displayName, trustLevel, badge]
      properties:
        id:
          type: string
          format: uuid
          description: 公开用户 UUID；用于举报用户等稳定引用。
        handle:
          type: string
        displayName:
          type: string
        avatarUrl:
          type: [string, 'null']
        trustLevel:
          type: integer
          minimum: 0
          maximum: 4
        badge:
          $ref: '#/components/schemas/DeviceBadge'
    TagSearchItem:
      type: object
      additionalProperties: false
      required: [slug, name, postCount]
      properties:
        slug:
          type: string
          example: dsh
        name:
          type: string
          example: DSH
        postCount:
          type: integer
          minimum: 0
    Device:
      type: object
      additionalProperties: false
      required: [id, fingerprint, kernelVersion, platform, status, createdAt, lastVerifiedAt]
      properties:
        id:
          type: string
          format: uuid
        fingerprint:
          type: string
          pattern: '^[0-9a-f]{64}$'
          description: SPKI DER 的 SHA-256；界面通常只展示前 16 位（附录 A.3）。
        kernelVersion:
          type: string
          maxLength: 64
          example: 6.8.0-45-generic
        platform:
          type: string
          enum: [win32-x64, win32-arm64, darwin-x64, darwin-arm64, linux-x64, linux-arm64]
        label:
          type: [string, 'null']
          maxLength: 40
          example: 主力工作站
        status:
          type: string
          enum: [active, revoked]
        createdAt:
          type: string
          format: date-time
        lastVerifiedAt:
          type: string
          format: date-time
        revokedAt:
          type: [string, 'null']
          format: date-time
    DeviceChallengeInfo:
      type: object
      additionalProperties: false
      required: [challenge, expiresAt, protocolVersion, cliCommand]
      properties:
        challenge:
          type: string
          description: base64url（无填充）一次性挑战；明文只在此响应出现一次（REQ-F-091）。
          example: Y2hhbGxlbmdlLXNhbXBsZQ
        expiresAt:
          type: string
          format: date-time
        protocolVersion:
          type: string
          const: community-device-v1
        cliCommand:
          type: string
          description: 可复制的本机 CLI 命令示例；含 challenge 与当前 handle，不含令牌/私钥。
          example: whalepod-device sign --challenge Y2hhbGxlbmdlLXNhbXBsZQ --handle alice
    DeviceVerificationResult:
      type: object
      additionalProperties: false
      required: [device, badge]
      properties:
        device:
          $ref: '#/components/schemas/Device'
        badge:
          $ref: '#/components/schemas/DeviceBadge'
    NotificationPayload:
      type: object
      additionalProperties: false
      required: [summary]
      properties:
        summary:
          type: string
          maxLength: 300
          example: 你的帖子已通过审核。
        targetType:
          type: string
          enum: [post, comment, user, device, account]
        targetId:
          type: [string, 'null']
          format: uuid
        targetUrl:
          type: [string, 'null']
          description: 仅允许站内相对路径，例如 `/posts/018f...?comment=018f...`（REQ-F-076）。
          example: /posts/018f4a2e-7c3b-7c4a-9f00-000000000001
    Notification:
      type: object
      additionalProperties: false
      required: [id, type, payload, createdAt]
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
          enum:
            - reply
            - comment_accepted
            - mention
            - post_approved
            - post_rejected
            - comment_approved
            - comment_rejected
            - device_verified
            - device_revoked
            - account_status_changed
            - report_result
            - appeal_result
        payload:
          $ref: '#/components/schemas/NotificationPayload'
        readAt:
          type: [string, 'null']
          format: date-time
        createdAt:
          type: string
          format: date-time
    NotificationList:
      type: object
      additionalProperties: false
      required: [items, nextCursor, unreadCount]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Notification'
        nextCursor:
          type: [string, 'null']
        unreadCount:
          type: integer
          minimum: 0
    NotificationReadResult:
      type: object
      additionalProperties: false
      required: [read, unreadCount]
      properties:
        read:
          type: boolean
        unreadCount:
          type: integer
          minimum: 0
    ReportReceipt:
      type: object
      additionalProperties: false
      required: [id, targetType, targetId, reason, status, createdAt]
      properties:
        id:
          type: string
          format: uuid
        targetType:
          type: string
          enum: [post, comment, user]
        targetId:
          type: string
          format: uuid
        reason:
          type: string
          enum: [spam, harassment, misclassified, plagiarism, other]
        status:
          type: string
          enum: [pending, resolved, dismissed]
        createdAt:
          type: string
          format: date-time
    SearchCounts:
      type: object
      additionalProperties: false
      required: [posts, users, tags]
      properties:
        posts:
          type: integer
          minimum: 0
        users:
          type: integer
          minimum: 0
        tags:
          type: integer
          minimum: 0
    SearchData:
      type: object
      additionalProperties: false
      required: [query, type, counts, nextCursor]
      properties:
        query:
          type: string
          example: 代理
        type:
          type: string
          enum: [posts, users, tags]
          description: 本次分页的类型；其他类型的命中数由 `counts` 给出，用于分组展示（REQ-F-081）。
        counts:
          $ref: '#/components/schemas/SearchCounts'
        posts:
          type: array
          items:
            $ref: '#/components/schemas/PostSummary'
          description: 仅当 `type=posts` 时返回。
        users:
          type: array
          items:
            $ref: '#/components/schemas/UserSearchItem'
          description: 仅当 `type=users` 时返回。
        tags:
          type: array
          items:
            $ref: '#/components/schemas/TagSearchItem'
          description: 仅当 `type=tags` 时返回。
        nextCursor:
          type: [string, 'null']
    TagDetail:
      type: object
      additionalProperties: false
      required: [tag, posts]
      properties:
        tag:
          $ref: '#/components/schemas/Tag'
        posts:
          $ref: '#/components/schemas/PostList'
        note:
          type: string
          description: 标签页只聚合公开帖子，隐藏标签不出现（REQ-F-082）。
    UploadResult:
      type: object
      additionalProperties: false
      required: [id, url, width, height, mimeType, byteSize]
      properties:
        id:
          type: string
          format: uuid
          description: 临时上传 ID（MediaUpload），用于创建/编辑帖子；不是 PostImage ID。
        url:
          type: string
          example: /media/2026/10/example-upload.webp
        width:
          type: integer
          minimum: 1
        height:
          type: integer
          minimum: 1
        mimeType:
          type: string
          enum: [image/jpeg, image/png, image/webp, image/gif]
        byteSize:
          type: integer
          maximum: 10485760
    CategoryList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Category'

    PostImageInput:
      type: object
      additionalProperties: false
      required: [id]
      properties:
        id:
          type: string
          format: uuid
          description: 上传接口返回的临时 MediaUpload ID；必须属于当前用户、状态 temp，且未被其他帖子使用。
        altText:
          type: [string, 'null']
          maxLength: 200
    ArtifactInput:
      type: object
      additionalProperties: false
      required: [kind, name, content]
      properties:
        kind:
          type: string
          enum: [patch, yaml, json, bundle, markdown, shell]
        name:
          type: string
          minLength: 1
          maxLength: 120
        note:
          type: [string, 'null']
          maxLength: 200
        content:
          type: string
          minLength: 1
          maxLength: 200000
    PostCreateRequest:
      type: object
      additionalProperties: false
      required: [title, categoryId, bodyMd]
      properties:
        title:
          type: string
          minLength: 8
          maxLength: 200
        categoryId:
          type: string
          format: uuid
        bodyMd:
          type: string
          minLength: 10
          maxLength: 60000
        tags:
          type: array
          maxItems: 6
          items:
            type: string
            pattern: '^[a-z0-9][a-z0-9-]*$'
          description: 标签 slug；必须已存在且为 active，最多 6 个；隐藏或不存在的标签返回 `VALIDATION_FAILED`。（REQ-F-025、REQ-F-034 AC4）
        environment:
          $ref: '#/components/schemas/Environment'
        artifacts:
          type: array
          maxItems: 5
          items:
            $ref: '#/components/schemas/ArtifactInput'
        images:
          type: array
          maxItems: 10
          items:
            $ref: '#/components/schemas/PostImageInput'
    PostUpdateRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      description: 提供的字段才更新；`tags/artifacts` 提供时整体替换；图片通过 `keepImageIds` + `images` 组合替换。必须携带 `If-Match`，版本不匹配返回 409（REQ-F-033）。
      properties:
        title:
          type: string
          minLength: 8
          maxLength: 200
        categoryId:
          type: string
          format: uuid
        bodyMd:
          type: string
          minLength: 10
          maxLength: 60000
        tags:
          type: array
          maxItems: 6
          items:
            type: string
            pattern: '^[a-z0-9][a-z0-9-]*$'
        environment:
          $ref: '#/components/schemas/Environment'
        artifacts:
          type: array
          maxItems: 5
          items:
            $ref: '#/components/schemas/ArtifactInput'
        keepImageIds:
          type: array
          maxItems: 10
          uniqueItems: true
          items:
            type: string
            format: uuid
          description: 要保留的现有 PostImage ID；必须属于本帖。与 `images` 任一提供时按最终集合替换，未列出的现有图片删除并清理对象。
        images:
          type: array
          maxItems: 10
          items:
            $ref: '#/components/schemas/PostImageInput'
          description: 新增的临时上传；与 `keepImageIds` 合计 ≤10。只提供 `images` 会移除所有现有图片。
        reason:
          type: [string, 'null']
          maxLength: 500
          description: 管理员编辑非本人内容时必填，写入审计（REQ-F-007 AC3）；作者编辑时忽略/可空。
    CommentUpdateRequest:
      type: object
      additionalProperties: false
      required: [bodyMd]
      properties:
        bodyMd:
          type: string
          minLength: 2
          maxLength: 10000
    CommentCreateRequest:
      type: object
      additionalProperties: false
      required: [bodyMd]
      properties:
        bodyMd:
          type: string
          minLength: 2
          maxLength: 10000
        parentId:
          type: [string, 'null']
          format: uuid
          description: 回复父评论；必须属于同一帖子（REQ-F-052）。
    LikeRequest:
      type: object
      additionalProperties: false
      required: [liked]
      properties:
        liked:
          type: boolean
          description: 置为 true 表示点赞，false 表示取消；相同状态重复提交幂等（REQ-F-050 AC1）。
    ReportCreateRequest:
      type: object
      additionalProperties: false
      required: [targetType, targetId, reason]
      properties:
        targetType:
          type: string
          enum: [post, comment, user]
        targetId:
          type: string
          format: uuid
        reason:
          type: string
          enum: [spam, harassment, misclassified, plagiarism, other]
          description: 举报原因（REQ-F-055 AC1）。
        detail:
          type: [string, 'null']
          maxLength: 1000
          description: 补充说明；不要填写举报人联系方式等敏感信息。
    DeviceCompleteRequest:
      type: object
      additionalProperties: false
      required:
        - version
        - challenge
        - handle
        - timestamp
        - kernelVersion
        - platform
        - publicKey
        - signature
      properties:
        version:
          type: integer
          const: 1
          description: 对应协议 community-device-v1（附录 A.5）。
        challenge:
          type: string
          minLength: 16
          maxLength: 128
          description: 服务端签发、未使用、未过期的 base64url 挑战。
          example: Y2hhbGxlbmdlLXNhbXBsZQ
        handle:
          type: string
          pattern: '^[a-z0-9][a-z0-9-]*$'
          description: 必须与当前登录用户 handle 一致；参与签名消息。
        timestamp:
          type: integer
          description: Unix 秒；服务端允许 ±300 秒偏差（REQ-F-094 AC4）。
          example: 1760000000
        kernelVersion:
          type: string
          pattern: '^[0-9]+\.[0-9]+\.[0-9]+(?:-[0-9A-Za-z.-]+)?$'
          maxLength: 64
          example: 6.8.0-45-generic
        platform:
          type: string
          enum: [win32-x64, win32-arm64, darwin-x64, darwin-arm64, linux-x64, linux-arm64]
        publicKey:
          type: string
          minLength: 44
          maxLength: 200
          description: Ed25519 公钥，SPKI DER 的 base64；私钥绝不上传（附录 A.3）。
          example: MCowBQYDK2VwAyEAexamplePublicKeyPlaceholder0000000000
        signature:
          type: string
          minLength: 64
          maxLength: 128
          description: 64 字节签名的 base64；服务端按附录 A.2 重建消息。
          example: ZXhhbXBsZS1zaWduYXR1cmUtcGxhY2Vob2xkZXItMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDA=
        label:
          type: [string, 'null']
          maxLength: 40
          description: 可选设备备注，不参与签名（REQ-F-097 AC6）。
          example: 主力工作站
    ModerationQueueItem:
      type: object
      additionalProperties: false
      required:
        - targetType
        - targetId
        - contentVersion
        - title
        - excerpt
        - author
        - riskHints
        - reportCount
        - submittedAt
      properties:
        targetType:
          type: string
          enum: [post, comment]
        targetId:
          type: string
          format: uuid
        contentVersion:
          type: integer
          minimum: 1
        title:
          type: string
          description: 帖子标题；评论为“评论”占位。
        excerpt:
          type: string
          maxLength: 500
        category:
          $ref: '#/components/schemas/Category'
        author:
          $ref: '#/components/schemas/Author'
        riskHints:
          type: array
          items:
            type: string
          description: 机审命中/风险提示，不含举报人身份。
        reportCount:
          type: integer
          minimum: 0
        submittedAt:
          type: string
          format: date-time
        aiSuggestion:
          oneOf:
            - $ref: '#/components/schemas/AiSuggestionSummary'
            - type: 'null'
        appeal:
          type: object
          additionalProperties: false
          description: 作者申诉信息（REQ-F-139）；无申诉时不返回；提交/复核由 SSR 管理流程承担。
          required: [id, status, submittedAt]
          properties:
            id:
              type: string
              format: uuid
            status:
              type: string
              enum: [pending, accepted, rejected]
            submittedAt:
              type: string
              format: date-time
            note:
              type: string
              maxLength: 1000
    AiSuggestionSummary:
      type: object
      additionalProperties: false
      required: [id, suggestion, policyCode, confidence, reason, modelName, modelVersion, modelQuantization, createdAt]
      properties:
        id:
          type: string
          format: uuid
          description: 建议 ID；管理员裁决时作为 `suggestionId` 传入（REQ-F-132）。
        suggestion:
          type: string
          enum: [approve, reject, escalate]
          description: AI 只建议，不改变内容状态（REQ-F-131）。
        policyCode:
          type: string
          example: spam_ad
        confidence:
          type: number
          minimum: 0
          maximum: 1
          example: 0.86
        reason:
          type: string
          maxLength: 2000
        modelName:
          type: string
        modelVersion:
          type: string
        modelQuantization:
          type: string
        createdAt:
          type: string
          format: date-time
    ModerationQueue:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ModerationQueueItem'
        nextCursor:
          type: [string, 'null']
    ModerationActionRequest:
      description: 人工裁决请求；按动作分为互斥形态，便于强制驳回/隐藏/删除/升级填写理由。
      oneOf:
        - $ref: '#/components/schemas/ModerationApproveActionRequest'
        - $ref: '#/components/schemas/ModerationReasonedActionRequest'
        - $ref: '#/components/schemas/ModerationRestoreActionRequest'
        - $ref: '#/components/schemas/ModerationEscalateActionRequest'
    ModerationApproveActionRequest:
      type: object
      additionalProperties: false
      required: [action, expectedContentVersion]
      properties:
        action:
          type: string
          const: approve
          description: 人工通过内容；AI 不能调用本端点（REQ-F-131）。
        expectedContentVersion:
          type: integer
          minimum: 1
          description: 当前内容版本；与数据库不一致返回 409 `CONTENT_VERSION_STALE`。
        reason:
          type: [string, 'null']
          maxLength: 500
          description: 可选说明；管理员操作写入审计。
        suggestionId:
          type: [string, 'null']
          format: uuid
          description: 关联的 AI 建议；采纳可一键确认，覆盖时必须填写 `overrideReason`（REQ-F-132 AC3）。
        overrideReason:
          type: [string, 'null']
          maxLength: 1000
          description: 覆盖 AI 建议的理由；与建议不一致时必填。
    ModerationReasonedActionRequest:
      type: object
      additionalProperties: false
      required: [action, reason, expectedContentVersion]
      properties:
        action:
          type: string
          enum: [reject, hide, delete]
          description: 驳回/隐藏/删除必须填写理由（REQ-F-062 AC2）。
        reason:
          type: string
          minLength: 1
          maxLength: 500
        expectedContentVersion:
          type: integer
          minimum: 1
        suggestionId:
          type: [string, 'null']
          format: uuid
        overrideReason:
          type: [string, 'null']
          maxLength: 1000
          description: 覆盖 AI 建议时必须填写理由（REQ-F-132 AC3）。
    ModerationRestoreActionRequest:
      type: object
      additionalProperties: false
      required: [action, expectedContentVersion]
      properties:
        action:
          type: string
          const: restore
          description: 将被隐藏内容恢复为 approved（附录 B.1）。
        expectedContentVersion:
          type: integer
          minimum: 1
        reason:
          type: [string, 'null']
          maxLength: 500
        suggestionId:
          type: [string, 'null']
          format: uuid
        overrideReason:
          type: [string, 'null']
          maxLength: 1000
    ModerationEscalateActionRequest:
      type: object
      additionalProperties: false
      required: [action, reason, expectedContentVersion]
      properties:
        action:
          type: string
          const: escalate
          description: 人工标记优先复核/升级（REQ-F-111 AC3、REQ-F-132 AC2）。内容保持 `pending`，不会因此公开。
        reason:
          type: string
          minLength: 1
          maxLength: 500
          description: 升级原因；写入审计与任务记录。
        expectedContentVersion:
          type: integer
          minimum: 1
        suggestionId:
          type: [string, 'null']
          format: uuid
          description: 可关联 AI 的 escalate 建议。
        overrideReason:
          type: [string, 'null']
          maxLength: 1000
    ModerationActionResult:
      type: object
      additionalProperties: false
      required: [actionId, targetType, targetId, moderationStatus, version]
      properties:
        actionId:
          type: string
          format: uuid
        targetType:
          type: string
          enum: [post, comment]
        targetId:
          type: string
          format: uuid
        moderationStatus:
          type: string
          enum: [pending, approved, rejected, hidden, deleted]
        version:
          type: integer
          minimum: 1
        taskStatus:
          type: [string, 'null']
          enum: [queued, claimed, suggested, human_decided, escalated, expired, null]
        suggestionAdopted:
          type: [boolean, 'null']
          description: 是否采纳了关联 AI 建议；未关联建议时为 null。
    AdminReport:
      type: object
      additionalProperties: false
      required: [id, targetType, targetId, reason, status, createdAt]
      properties:
        id:
          type: string
          format: uuid
        reporter:
          type: object
          additionalProperties: false
          description: 举报人摘要，仅管理员可见，不向普通用户/作者/Agent 暴露（REQ-F-055 AC4、REQ-F-129 AC2）。
          required: [handle]
