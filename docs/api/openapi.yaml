      description: |
        支持 JPG/PNG/WebP/GIF，单张 ≤10 MB；每帖最多 10 张（REQ-F-036）。服务端按内容嗅探格式、忽略扩展名与声明 Content-Type，统一重编码为**静态 WebP**（动画 GIF/WebP 取首帧，策略见详细设计）并去除 EXIF/ICC 等元数据；拒绝 SVG/可执行文件。
        最长边 ≤8192 像素且总像素 ≤25,000,000、动画 ≤64 帧；超限返回 `400 VALIDATION_FAILED`（`details.issues[].field=file`）。文件超 10 MB 返回 413 `UPLOAD_TOO_LARGE`；类型不支持返回 415 `UPLOAD_UNSUPPORTED_TYPE`。
        上传需要登录、CSRF 与独立限流；返回临时 `MediaUpload` ID，用于创建/编辑帖子。未关联帖子的上传记录 24 小时后由清理任务回收（REQ-F-036 AC6、REQ-I-003）。
