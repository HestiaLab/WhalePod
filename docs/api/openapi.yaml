        modelRuntime:
          type: string
          const: local
        runtimeLocation:
          type: string
          const: local
        promptVersion:
          type: string
          example: moderation-prompt-v1
        idempotencyKey:
          type: string
          minLength: 8
          maxLength: 100
          description: 服务账号内唯一；重复提交返回同一建议结果（REQ-F-130 AC6）。
          example: task-018f4a2e-attempt-1
        latencyMs:
          type: [integer, 'null']
          minimum: 0
        tokenUsage:
          type: object
          additionalProperties: true
          description: "例如 `{prompt: 1200, completion: 180, total: 1380}`，用于预算统计。token 用量仅用于配额与成本统计。"
    AgentSuggestionResult:
      type: object
      additionalProperties: false
      required: [suggestionId, taskId, status, contentStatus, humanDecided, idempotencyKey, createdAt]
      properties:
        suggestionId:
          type: string
          format: uuid
        taskId:
          type: string
          format: uuid
        status:
          type: string
          const: recorded
        contentStatus:
          type: string
          const: pending
          description: AI 建议不改变内容审核状态；内容继续等待人工裁决（REQ-F-131 AC1/AC6）。
        humanDecided:
          type: boolean
          const: false
        idempotencyKey:
          type: string
        createdAt:
          type: string
          format: date-time
    AgentReleaseRequest:
      type: object
      additionalProperties: false
      properties:
        reason:
          type: [string, 'null']
          maxLength: 200
          example: 本机模型超时，释放给人工或其他 Agent。
    AgentReleaseResult:
      type: object
      additionalProperties: false
      required: [released, taskId, taskStatus]
      properties:
        released:
          type: boolean
        taskId:
          type: string
          format: uuid
        taskStatus:
          type: string
          enum: [queued]
    AgentHeartbeatRequest:
      type: object
      additionalProperties: false
      required: [instanceName, hostFingerprint, agentVersion, runtimeLocation, model, queueDepth]
      properties:
        instanceName:
          type: string
          minLength: 1
          maxLength: 80
          example: maintainer-laptop-01
        hostFingerprint:
          type: string
          pattern: '^[0-9a-f]{64}$'
          description: 主机指纹（SHA-256），仅用于审计/去重，不含硬件隐私。
        agentVersion:
          type: string
          maxLength: 40
          example: 0.1.0
        mcpVersion:
          type: [string, 'null']
          maxLength: 40
          example: 0.1.0
        runtimeLocation:
          type: string
          const: local
        model:
          $ref: '#/components/schemas/ModelInfo'
        queueDepth:
          type: integer
          minimum: 0
        lastProcessedAt:
          type: [string, 'null']
          format: date-time
    AgentHeartbeatResult:
      type: object
      additionalProperties: false
      required: [instanceId, status, serverTime, aiEnabled, suggestionsPaused, policyVersion, heartbeatIntervalSeconds]
      properties:
        instanceId:
          type: string
          format: uuid
        status:
          type: string
          enum: [active, paused, revoked]
        serverTime:
          type: string
          format: date-time
        aiEnabled:
          type: boolean
        suggestionsPaused:
          type: boolean
          description: 建议是否暂停；暂停时 heartbeat/policy/只读仍可用，claim/suggestion 返回 AGENT_DISABLED（REQ-F-132 AC6、REQ-F-143 AC7）。
        policyVersion:
          type: string
        heartbeatIntervalSeconds:
          type: integer
          minimum: 10
    AgentPolicyCategory:
      type: object
      additionalProperties: false
      required: [code, name]
      properties:
        code:
          type: string
          example: spam_ad
        name:
          type: string
          example: 垃圾广告
    AgentPolicy:
      type: object
      additionalProperties: false
      required:
        - enabled
        - suggestionsPaused
        - policyVersion
        - suggestionTypes
        - categories
        - leaseSeconds
        - modelAllowlist
        - contentLimits
        - untrustedContentNotice
      properties:
        enabled:
          type: boolean
          description: AI/MCP 总开关；false 时所有 `/agent/*` 返回 `AGENT_DISABLED`（REQ-F-143）。
        suggestionsPaused:
          type: boolean
          description: 建议暂停；为 true 时不生成新任务，claim/suggestion 返回 AGENT_DISABLED；heartbeat/policy/只读仍可用（REQ-F-132 AC6、REQ-F-143 AC7）。
        policyVersion:
          type: string
        suggestionTypes:
          type: array
          items:
            type: string
            enum: [approve, reject, escalate]
        categories:
          type: array
          items:
            $ref: '#/components/schemas/AgentPolicyCategory'
        leaseSeconds:
          type: integer
          minimum: 60
          example: 600
        modelAllowlist:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [name]
            properties:
              name:
                type: string
              version:
                type: [string, 'null']
              quantization:
                type: [string, 'null']
        contentLimits:
          type: object
          additionalProperties: false
          required: [maxBodyChars, maxArtifacts, maxImages]
          properties:
            maxBodyChars:
              type: integer
              minimum: 1
            maxArtifacts:
              type: integer
              minimum: 0
            maxImages:
              type: integer
              minimum: 0
        untrustedContentNotice:
          type: string

paths:
  /auth/csrf:
    get:
      tags: [认证]
      operationId: getCsrfToken
      summary: 获取 CSRF 防伪令牌
      description: |
        下发与当前会话身份绑定的防伪 Cookie（`whalepod_csrf`）并返回请求令牌。浏览器登录后应先调用本端点，
        再把 `token` 放入所有写请求的 `X-CSRF-Token` 头。Web 与 API 共享 Data Protection 密钥目录，Web 登录会话可直接使用。
        本端点需要有效会话；令牌与用户身份绑定，匿名用户无需获取。
      security:
        - cookieAuth: []
      responses:
        '200':
          description: 防伪令牌。
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/CsrfTokenResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
  /me/posts:
    get:
      tags: [我的内容]
      operationId: listMyPosts
      summary: 当前用户的帖子（含待审/驳回）
      description: |
        仅返回当前登录用户自己的、未删除帖子，状态仅可能为 `approved/pending/rejected`；`hidden/deleted` 不会返回。
        管理员调用同样只返回管理员自己的内容；审核全部内容请使用 `/admin/moderation/queue`。
        按 `updatedAt DESC, id DESC` 游标分页；`status` 筛选变化后旧 `cursor` 失效并返回 400。
        未登录返回 401；待激活账号返回 403 `FORBIDDEN` 且 `details.reason=activation_required`；banned/deleted 返回 403；muted 仍可读。
        响应复用公开 `PostSummary` 结构，不返回他人内容或举报人信息。
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - name: status
          in: query
          required: false
          description: 按审核状态筛选；缺省返回 approved/pending/rejected。
          schema:
            type: string
            enum: [approved, pending, rejected]
      responses:
        '200':
          description: 当前用户的帖子分页。
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/PostList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
  /me/comments:
    get:
      tags: [我的内容]
      operationId: listMyComments
      summary: 当前用户的评论（含待审/驳回）
      description: |
        仅返回当前登录用户自己的、未删除评论，状态仅可能为 `approved/pending/rejected`；`hidden/deleted` 不会返回。
        管理员调用同样只返回管理员自己的内容。按 `updatedAt DESC, id DESC` 游标分页；`status` 筛选变化后旧 `cursor` 失效并返回 400。
        未登录返回 401；待激活账号返回 403 `FORBIDDEN` 且 `details.reason=activation_required`；banned/deleted 返回 403；muted 仍可读。
        响应复用公开 `Comment` 结构，不返回他人评论。
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - name: status
          in: query
          required: false
          description: 按审核状态筛选；缺省返回 approved/pending/rejected。
          schema:
            type: string
            enum: [approved, pending, rejected]
      responses:
        '200':
          description: 当前用户的评论分页。
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/CommentList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
  /feed:
    get:
      tags: [信息流与帖子]
      operationId: getFeed
      summary: 获取公开信息流
      description: |
        默认只返回 `approved` 且未删除的帖子（REQ-F-021、REQ-F-026）。支持“最新 / 最近活跃 / 待解决”排序（REQ-F-022），分页为游标式。
        访客可匿名读取；登录用户不会在此接口看到待审/驳回内容（作者视图请使用帖子详情）。
      security:
        - {}
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - name: sort
          in: query
          required: false
          schema:
            type: string
            enum: [latest, active, unresolved]
            default: latest
        - name: category
          in: query
          required: false
          description: 板块 slug；与标签筛选可同时使用。
          schema:
            type: string
            example: reproducible
        - name: tag
          in: query
          required: false
          description: 标签 slug。
          schema:
            type: string
            example: dsh
      responses:
        '200':
          description: 信息流分页结果。
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/PostList'
              examples:
                feed:
                  summary: 最新公开帖子
                  value:
                    data:
                      items:
                        - id: 018f4a2e-7c3b-7c4a-9f00-000000000001
                          title: 在 Ubuntu 24.04 上让 DSH 0.2.1 通过代理启动
                          excerpt: 记录内核版本、复现步骤与补丁产物。
                          category:
                            id: 018f4a2e-7c3b-7c4a-9f00-000000000010
                            slug: reproducible
                            name: 踩坑实测
                            description: 带环境信息与复现步骤的实测记录
                            displayOrder: 3
                            status: active
                          author:
                            id: 018f4a2e-7c3b-7c4a-9f00-000000000002
                            handle: alice
                            displayName: 海豚
                            trustLevel: 2
                            badge:
                              verified: true
                              activeDeviceCount: 1
                              lastVerifiedAt: '2026-10-20T08:30:00Z'
                          tags:
                            - slug: dsh
                              name: DSH
                          moderationStatus: approved
                          isSolved: false
                          environment:
                            kernelVersion: 6.8.0-45-generic
                            platform: linux-x64
                            model: deepseek-flash
                          counts:
                            views: 128
                            copies: 21
                            likes: 9
                            comments: 4
                            artifacts: 1
                          createdAt: '2026-10-23T09:00:00Z'
                          lastActivityAt: '2026-10-24T03:20:00Z'
                      nextCursor: null
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
  /categories:
    get:
      tags: [信息流与帖子]
      operationId: listCategories
      summary: 获取可用板块
      description: 返回 `active` 板块，用于信息流筛选与发帖选择；停用板块不出现在选择器（REQ-F-020）。
      security:
        - {}
        - cookieAuth: []
      responses:
        '200':
          description: 板块列表。
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/CategoryList'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
  /posts:
    post:
      tags: [信息流与帖子]
      operationId: createPost
      summary: 创建帖子
      description: |
        创建帖子并按审核策略进入 `pending` 或 `approved`（REQ-F-032、REQ-F-015/061）。必填标题、板块、正文；可选标签（≤6）、环境信息、图片（≤10）、产物（≤5）。
        服务端强制校验长度、平台枚举、产物成对字段与所有权；请求失败保留客户端输入。被禁言/封禁账号返回 `ACCOUNT_MUTED/ACCOUNT_BANNED`（REQ-F-005）。
        响应中的 `moderationStatus` 才是真实状态；待审内容不会出现在公开信息流。
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PostCreateRequest'
            examples:
              post:
                summary: 带环境信息与 patch 产物的实测帖
                value:
                  title: 在 Ubuntu 24.04 上让 DSH 0.2.1 通过代理启动
                  categoryId: 018f4a2e-7c3b-7c4a-9f00-000000000010
                  bodyMd: |
                    ## 环境
                    - 内核：6.8.0-45-generic
                    - 平台：linux-x64

                    ## 现象
                    启动时无法连接代理，日志提示 `dial tcp 127.0.0.1:7890: connect: connection refused`。

                    ## 处理
                    调整启动脚本中的代理环境变量后恢复，详见下方 patch。
                  tags: [dsh, proxy]
                  environment:
                    kernelVersion: 6.8.0-45-generic
                    platform: linux-x64
                    model: deepseek-flash
                  artifacts:
                    - kind: patch
                      name: 修复启动脚本.patch
                      note: 先备份原文件再应用
                      content: |
                        --- a/start.sh
                        +++ b/start.sh
                        @@ -1,2 +1,3 @@
                        -export HTTP_PROXY=
                        +export HTTP_PROXY=http://127.0.0.1:7890
                        +export HTTPS_PROXY=http://127.0.0.1:7890
                  images: []
      responses:
        '201':
          description: 创建成功；待审时 `moderationStatus=pending`。
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/PostDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
  /posts/{postId}:
    parameters:
      - $ref: '#/components/parameters/PostId'
    get:
      tags: [信息流与帖子]
      operationId: getPost
      summary: 获取帖子详情
      description: |
        公开详情只返回 `approved` 且未删除内容（REQ-F-024、REQ-F-026）。作者可读取自己的 `pending/rejected` 并看到审核说明；管理员可读取全部。
        已删除内容返回 `NOT_FOUND`，不伪装成 200（REQ-F-025 AC5/REQ-F-125）。响应 ETag 用于编辑并发控制。
      security:
        - {}
        - cookieAuth: []
      responses:
        '200':
          description: 帖子详情。
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/PostDetail'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    patch:
      tags: [信息流与帖子]
      operationId: updatePost
      summary: 编辑帖子
      description: |
        仅作者或管理员可编辑（REQ-F-033、REQ-F-027）。必须携带 `If-Match`，版本不一致返回 `409 CONFLICT`，不静默覆盖。
        管理员编辑非本人内容必须在请求体提供 `reason`，写入审计（REQ-F-007 AC3）。
        图片编辑：`keepImageIds` 保留现有图片，`images` 新增临时上传；两者合计 ≤10，未列出的旧图片会被删除并清理对象。
        当前版本策略：非管理员作者编辑帖子后版本递增并重新进入 `pending`；管理员编辑不改变现有审核状态，但必须写审计。
        响应返回最新 `moderationStatus` 与版本。管理员编辑他人内容需在审计中记录操作者、目标、原因（REQ-F-007 AC3）。
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PostUpdateRequest'
            examples:
              update:
                summary: 更新正文与产物
                value:
                  bodyMd: |
                    ## 环境
                    - 内核：6.8.0-45-generic
                    - 平台：linux-x64

                    ## 补充
                    已确认代理端口为 7890，并补充 systemd 配置。
                  artifacts:
                    - kind: yaml
                      name: systemd-override.yaml
                      note: 放入 /etc/systemd/system/dsh.service.d/
                      content: |
                        [Service]
                        Environment="HTTP_PROXY=http://127.0.0.1:7890"
      responses:
        '200':
          description: 更新成功；可能重新进入审核。
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/PostDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [信息流与帖子]
      operationId: deletePost
      summary: 删除自己的帖子
      description: |
        作者软删除自己的帖子（REQ-F-027）。管理员删除他人内容请走 `/admin/moderation/{targetType}/{targetId}/action` 以强制填写原因并留审计。
        删除后公开列表/详情/搜索不可见；保留审计所需最短数据。
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '200':
          description: 已软删除。
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data]
                properties:
                  data:
                    type: object
                    additionalProperties: false
                    required: [id, deleted]
                    properties:
                      id:
                        type: string
                        format: uuid
                      deleted:
                        type: boolean
                        const: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
  /posts/{postId}/comments:
    parameters:
      - $ref: '#/components/parameters/PostId'
    get:
      tags: [评论与互动]
      operationId: listPostComments
      summary: 评论列表
      description: 公开评论列表只返回 approved 且未删除的评论，并保留“已删除但有公开子评论”的父评论占位；待审/驳回评论不出现在公开列表。评论作者可在创建/编辑响应中看到自己的待审评论，管理员可在审核队列查看；帖子作者不能读取他人待审评论（REQ-F-026、REQ-F-052）。支持父子嵌套与“最新/点赞最多”排序。
      security:
        - {}
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - name: sort
          in: query
          required: false
          schema:
            type: string
            enum: [latest, top]
            default: latest
      responses:
        '200':
          description: 评论分页。
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/CommentList'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [评论与互动]
      operationId: createComment
      summary: 发表评论
      description: |
        登录成员可评论或回复（REQ-F-051）。评论受审核策略约束，可能为 `pending`；提交后显示在正确位置，失败保留输入。
