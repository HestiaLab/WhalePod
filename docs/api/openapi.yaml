    get:
      tags: [管理后台 - 审核]
      operationId: getModerationQueue
      summary: 待审队列
      description: |
        仅管理员可访问（REQ-F-110、REQ-F-111）。展示待审内容、作者、板块、风险命中、AI 建议与置信度、提交时间。
        队列按“当前内容版本是否被人工 escalate”优先：当前版本存在人工 `escalate` 动作或活跃 `escalated` 审核任务的 `pending` 内容排在前面；同优先级按提交时间升序、ID 升序。作者编辑导致内容版本变化后，旧版本 escalate 不再让新版本自动优先。
        `aiSuggestion` 只来自当前内容版本最新且真实的 `ModerationSuggestion`，无建议时为 `null`；`riskHints` 来自当前版本最新 `ModerationCheck.RiskLabels`，无数据时为 `[]`，不伪造、不改变内容状态。
        分页为不透明游标，游标绑定 `targetType` 筛选；AI 建议仅作参考，内容仍为 `pending`，必须人工裁决（REQ-F-131、REQ-F-132）。
      security:
        - cookieAuth: []
      parameters:
        - name: targetType
          in: query
          required: false
          schema:
            type: string
            enum: [post, comment]
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
