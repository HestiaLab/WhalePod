          type: string
          minLength: 1
          maxLength: 500
        expiresAt:
          type: [string, 'null']
          format: date-time
          description: 禁言必填且必须晚于当前时间；封禁可为空表示永久。
    ReportResolveRequest:
      type: object
      additionalProperties: false
