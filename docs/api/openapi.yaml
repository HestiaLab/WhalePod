    patch:
      tags: [评论与互动]
      operationId: updateComment
      summary: 编辑评论
      description: |
        仅评论作者或管理员可编辑（REQ-F-027）。必须携带 `If-Match`（ETag 形如 `"v3"`），版本不匹配返回 `409 CONFLICT`。
        当前版本策略：非管理员作者编辑后重新进入 `pending`；管理员编辑不改变现有审核状态。管理员编辑他人评论必须通过 `reason` 说明并写审计（REQ-F-007 AC3）。
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IfMatch'
        - name: reason
          in: query
          required: false
          description: 管理员编辑非本人评论时必填，最多 500 字符。
          schema:
            type: string
            maxLength: 500
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommentUpdateRequest'
            examples:
              edit:
                summary: 作者修正评论
                value:
                  bodyMd: 补充一下：Ubuntu 24.04 需要先执行 systemctl daemon-reload。
      responses:
        '200':
          description: 更新后的评论；可能重新进入审核。
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/Comment'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [评论与互动]
      operationId: deleteComment
      summary: 删除评论
      description: |
        作者软删除自己的评论，或管理员删除任意评论（REQ-F-027、REQ-F-054）。必须携带 `If-Match`；删除后保留占位以维持子评论归属。
        若删除的是被采纳评论，同一事务取消采纳、回退帖子 `isSolved` 并通知相关方（REQ-F-028 AC3、REQ-F-054 AC5）。管理员删除必须提供 `reason` 并写审计。
      security:
        - cookieAuth: []
      parameters:
