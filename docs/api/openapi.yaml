      description: |
        为当前登录用户生成一次性 challenge，默认 TTL 300 秒；服务端只保存哈希，明文只出现一次（REQ-F-091、附录 A.4）。
        绑定当前用户，允许同一用户有多个未过期 challenge；按用户/IP 限流（REQ-F-098 AC3）。验签失败不消耗 challenge。
