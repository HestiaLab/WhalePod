              schema:
                type: object
                additionalProperties: false
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/AgentSuggestionResult'
              examples:
                recorded:
                  summary: 建议已记录但不改变内容状态
                  value:
                    data:
                      suggestionId: 018f4a2e-7c3b-7c4a-9f00-0000000000d1
                      taskId: 018f4a2e-7c3b-7c4a-9f00-0000000000c1
                      status: recorded
