        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
  /admin/moderation/{targetType}/{targetId}/action:
    post:
      tags: [管理后台 - 审核]
      operationId: moderateContent
      summary: 人工裁决内容
      description: |
        仅管理员可调用；支持通过、驳回、隐藏、恢复、删除与升级人工复核，状态流转遵循 SRS 附录 B.1（REQ-F-060、REQ-F-062、REQ-F-111）。
        驳回/隐藏/删除/升级必须填写原因；操作前二次确认，通过/驳回/隐藏/恢复/删除后通知作者并写审计；升级只标记优先复核与审计。
        版本过期返回 `409 CONTENT_VERSION_STALE`。
        `escalate` 只把任务/内容标记为优先人工复核，内容仍为 `pending`，不改变公开状态。
        可关联 AI 建议：采纳可一键确认；与建议不一致时必须填写 `overrideReason`，并进入质量统计（REQ-F-132）。
        **本端点只接受人工 Cookie 会话；AI 服务令牌不可调用，当前版本不存在自动通过/驳回动作（REQ-F-131）。**
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/TargetType'
        - $ref: '#/components/parameters/TargetId'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModerationActionRequest'
            examples:
              reject:
                summary: 驳回并说明理由
                value:
                  action: reject
                  reason: 正文包含未披露的推广链接，且无可复现步骤，违反社区公约。
                  expectedContentVersion: 12
                  suggestionId: 018f4a2e-7c3b-7c4a-9f00-0000000000a1
                  overrideReason: AI 建议通过，但人工复核发现正文末尾含联系方式与推广链接。
      responses:
        '200':
          description: 裁决结果与最新内容版本。
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/ModerationActionResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
