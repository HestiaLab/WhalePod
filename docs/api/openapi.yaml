        detail:
          type: [string, 'null']
          maxLength: 1000
        status:
          type: string
          enum: [pending, resolved, dismissed]
        handledAt:
          type: [string, 'null']
          format: date-time
        resolutionNote:
          type: [string, 'null']
          maxLength: 500
        createdAt:
          type: string
          format: date-time
    AdminReportList:
      type: object
