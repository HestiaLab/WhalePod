        outcome:
          type: string
          enum: [resolved, dismissed]
        resolutionNote:
          type: string
          minLength: 1
          maxLength: 500
        actions:
          type: array
          maxItems: 4
          items:
            $ref: '#/components/schemas/ReportResolveAction'
          description: 可同时执行内容与账号动作；每项均写审计并通知相关方（REQ-F-064 AC3/AC4）。`outcome=dismissed` 时必须为空。
      if:
        properties:
          outcome:
            const: dismissed
      then:
        properties:
          actions:
            maxItems: 0
