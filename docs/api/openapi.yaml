      summary: 释放任务
      description: |
        仅接受服务令牌，scope `moderation:suggest`（释放是工作流变更）。必须携带 `X-Agent-Instance-Id`，只允许当前领取实例释放；主动释放后任务回到队列，租约到期由系统自动回收（REQ-F-129 AC4、REQ-I-009）。
        **AI/MCP 关闭时返回 `503 AGENT_DISABLED`。** 建议暂停时 release 仍可用（用于归还租约）；建议只写建议记录，不改变内容审核状态；本 API 不提供自动裁决动作（REQ-F-131、REQ-F-143）。
      security:
        - serviceBearer: []
      x-required-scopes: [moderation:suggest]
      parameters:
        - $ref: '#/components/parameters/TaskId'
        - $ref: '#/components/parameters/AgentInstanceId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentReleaseRequest'
            examples:
              timeout:
                value:
                  reason: 本机模型超时，释放给人工或其他 Agent。
      responses:
        '200':
          description: 任务已释放回队列。
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/AgentReleaseResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: 任务不存在（`TASK_NOT_FOUND`）。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: 租约已过期或不属于当前实例（`TASK_LEASE_EXPIRED`）。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/AgentRateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/AgentDisabled'
  /agent/heartbeat:
    post:
      tags: [Agent API]
      operationId: agentHeartbeat
      summary: 上报 Agent 心跳
      description: |
        仅接受服务令牌，scope `agent:heartbeat`。上报实例、版本、运行位置、本地模型与队列深度，服务端记录最后心跳用于在线状态（REQ-I-009、REQ-F-119）。
        心跳不含用户内容、令牌或 PII。当前版本只允许 `runtimeLocation=local` 且模型在批准列表内；远程模型/异常位置被拒绝并可使实例暂停（REQ-F-140）。
        响应返回 `instanceId` 与 `suggestionsPaused`；后续任务列表/详情/领取/建议/释放必须携带 `X-Agent-Instance-Id`。
        **AI/MCP 关闭时返回 `503 AGENT_DISABLED`。** 建议暂停时 heartbeat 仍可用并返回 `suggestionsPaused=true`；建议只写建议记录，不改变内容审核状态；本 API 不提供自动裁决动作（REQ-F-131、REQ-F-143）。
      security:
        - serviceBearer: []
      x-required-scopes: [agent:heartbeat]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentHeartbeatRequest'
            examples:
              heartbeat:
                value:
                  instanceName: maintainer-laptop-01
                  hostFingerprint: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
                  agentVersion: 0.1.0
                  mcpVersion: 0.1.0
                  runtimeLocation: local
                  model:
                    name: deepseek-flash
                    version: pending-Q-02
                    quantization: pending-Q-02
                    runtime: local
                  queueDepth: 2
                  lastProcessedAt: '2026-10-24T03:30:00Z'
      responses:
        '200':
          description: 心跳已记录。
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/AgentHeartbeatResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: scope 不足（`SCOPE_DENIED`），或运行位置/模型未获批准。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                unapprovedModel:
                  value:
                    code: FORBIDDEN
                    message: 模型或运行位置未获批准，实例已暂停。
                    details:
                      reason: 远程模型/非本地运行位置不在当前版本允许范围。
        '429':
          $ref: '#/components/responses/AgentRateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/AgentDisabled'
  /agent/moderation/policy:
    get:
      tags: [Agent API]
      operationId: agentGetPolicy
      summary: 获取审核策略与类别
      description: |
        仅接受服务令牌，scope `moderation:read`。返回当前策略版本、允许的建议类型、类别清单、租约秒数、批准模型与内容限制（REQ-F-129、REQ-F-140）。
        **AI/MCP 关闭时返回 `503 AGENT_DISABLED`。** 建议暂停时 policy 仍可用并返回 `suggestionsPaused=true`；建议只写建议记录，不改变内容审核状态；本 API 不提供自动裁决动作（REQ-F-131、REQ-F-143）。
      security:
        - serviceBearer: []
      x-required-scopes: [moderation:read]
      responses:
        '200':
          description: 当前策略。
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/AgentPolicy'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/AgentRateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/AgentDisabled'
