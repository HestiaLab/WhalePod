  /agent/moderation/tasks/{taskId}/suggestion:
    post:
      tags: [Agent API]
      operationId: agentSubmitSuggestion
      summary: 提交结构化审核建议
      description: |
        仅接受服务令牌，scope `moderation:suggest`。提交 `approve/reject/escalate` 建议、策略码、理由、置信度、内容版本、策略版本、
        模型/量化版本、运行位置、提示词版本与幂等键（REQ-F-130、REQ-I-009）。未知字段/非法枚举/缺失理由返回 400；内容版本过期返回 409。
        **AI/MCP 关闭时返回 `503 AGENT_DISABLED`。** 建议暂停时 suggestion 同样返回 `503 AGENT_DISABLED`。
        **建议只写入建议记录，不改变内容审核状态；内容保持 `pending`，必须等待人工裁决（REQ-F-131 AC1/AC6）。**
        **本 API 不提供自动通过、自动驳回、隐藏、删除、禁言、封禁或策略修改动作；相同幂等键返回同一结果（REQ-F-130 AC6、REQ-F-131 AC4）。**
        必须携带 `X-Agent-Instance-Id`，且必须是任务当前领取实例；否则返回 409 `TASK_LEASE_EXPIRED` 或 403。
        仅接受 `runtimeLocation=local`、`modelRuntime=local` 且模型在管理员批准列表内；否则拒绝并告警（REQ-F-140）。
