                summary: 建议人工升级（内容含外部推广）
                value:
                  suggestion: escalate
                  policyCode: external_promotion
                  reason: 正文含未披露的外部推广链接，风险不确定，建议管理员人工优先复核。
                  confidence: 0.74
                  contentVersion: 12
                  policyVersion: policy-2026-10-24
                  model:
                    name: deepseek-flash
                    version: pending-Q-02
                    quantization: pending-Q-02
                    runtime: local
                  modelRuntime: local
                  runtimeLocation: local
                  promptVersion: moderation-prompt-v1
                  idempotencyKey: task-018f4a2e-attempt-1
                  latencyMs: 1840
                  tokenUsage:
                    prompt: 1200
                    completion: 180
                    total: 1380
      responses:
