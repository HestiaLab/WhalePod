                additionalProperties: false
                required: [data]
                properties:
                  data:
                    type: object
                    additionalProperties: false
                    required: [id, postId, deleted, acceptedCleared]
                    properties:
                      id:
                        type: string
                        format: uuid
                      postId:
                        type: string
                        format: uuid
                      deleted:
                        type: boolean
                        const: true
                      acceptedCleared:
                        type: boolean
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
