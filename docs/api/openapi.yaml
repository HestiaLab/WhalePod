  /devices/complete:
    post:
      tags: [设备验证]
      operationId: completeDeviceVerification
      summary: 完成设备验证
      description: |
        按附录 A.6 顺序校验：字段/长度 → challenge 存在/未过期/未使用/属于当前用户 → 时间戳 ±300 秒 → 公钥/签名编码 →
        按 A.2 重建消息并用 Ed25519 验签 → 公钥未绑定其他账号且未超设备上限 → 同一事务内标记 challenge 已使用并创建设备（REQ-F-094）。
        `handle` 必须与当前会话用户一致；错误不泄露其他用户 challenge 状态。重复使用/并发重放返回 `CHALLENGE_USED`/`CHALLENGE_EXPIRED` 等。
        验证只证明密钥持有，不证明环境未被篡改（REQ-F-100）。
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceCompleteRequest'
            examples:
              verification:
                summary: 粘贴 CLI 输出的设备验证请求
                value:
                  version: 1
                  challenge: Y2hhbGxlbmdlLXNhbXBsZQ
                  handle: alice
                  timestamp: 1760000000
                  kernelVersion: 6.8.0-45-generic
                  platform: linux-x64
                  publicKey: MCowBQYDK2VwAyEAexamplePublicKeyPlaceholder0000000000
                  signature: ZXhhbXBsZS1zaWduYXR1cmUtcGxhY2Vob2xkZXItMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDA=
                  label: 主力工作站
      responses:
        '201':
          description: 验证成功并绑定设备；徽章状态已更新。
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/DeviceVerificationResult'
        '400':
          description: 字段、时间戳或平台校验失败（`TIMESTAMP_INVALID` / `PLATFORM_UNSUPPORTED` / `VALIDATION_FAILED`）。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                timestampInvalid:
                  summary: 时间戳超窗
                  value:
                    code: TIMESTAMP_INVALID
                    message: 时间戳超出允许偏差，请校准本机时间后重新签名。
                    details:
                      allowedSkewSeconds: 300
                platformUnsupported:
                  summary: 平台不受支持
                  value:
                    code: PLATFORM_UNSUPPORTED
                    message: 平台不在受支持列表内，请使用受支持平台或更新 CLI。
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: 公钥已绑定其他账号或设备数量超限（`DEVICE_ALREADY_BOUND` / `DEVICE_LIMIT_REACHED`）。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: 连续验证失败触发短时锁定（`DEVICE_VERIFICATION_LOCKED`）；按 `Retry-After` 等待。
          headers:
            Retry-After:
              $ref: '#/components/headers/RetryAfter'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                locked:
                  summary: 验证短时锁定
                  value:
                    code: DEVICE_VERIFICATION_LOCKED
                    message: 连续验证失败次数过多，请按 Retry-After 等待后重试。
        '500':
          $ref: '#/components/responses/InternalError'
