name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "true"

jobs:
  verify:
    name: 发布前构建与测试
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: whalepod_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d whalepod_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      WHALEPOD_TEST_DB_CONNECTION: "Host=127.0.0.1;Port=5432;Database=whalepod_test;Username=postgres;Password=postgres"
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
          cache: true
          cache-dependency-path: |
            **/*.csproj
            Directory.Build.props
            global.json

      - name: 还原依赖
        run: dotnet restore WhalePod.slnx

      - name: 构建
        run: dotnet build WhalePod.slnx -c Release --no-restore

      - name: 运行测试
        run: dotnet test WhalePod.slnx -c Release --no-build

  publish:
    name: 发布 ${{ matrix.name }}
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: whalepod-web-linux-x64
            project: src/WhalePod.Web/WhalePod.Web.csproj
            rid: linux-x64
            self_contained: false
            single_file: false
          - name: whalepod-api-linux-x64
            project: src/WhalePod.Api/WhalePod.Api.csproj
            rid: linux-x64
            self_contained: false
            single_file: false
          - name: whalepod-device-win-x64
            project: src/WhalePod.DeviceCli/WhalePod.DeviceCli.csproj
            rid: win-x64
            self_contained: true
            single_file: true
          - name: whalepod-device-linux-x64
            project: src/WhalePod.DeviceCli/WhalePod.DeviceCli.csproj
            rid: linux-x64
            self_contained: true
            single_file: true
          - name: whalepod-device-osx-arm64
            project: src/WhalePod.DeviceCli/WhalePod.DeviceCli.csproj
            rid: osx-arm64
            self_contained: true
            single_file: true
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
          cache: true
          cache-dependency-path: |
            **/*.csproj
            Directory.Build.props
            global.json

      - name: 发布
        run: >
          dotnet publish "${{ matrix.project }}"
          -c Release
          -r "${{ matrix.rid }}"
          --self-contained "${{ matrix.self_contained }}"
          -p:PublishSingleFile="${{ matrix.single_file }}"
          -p:DebugType=None
          -p:DebugSymbols=false
          -o "out/${{ matrix.name }}"

      - name: 打包
        run: |
          cd "out/${{ matrix.name }}"
          zip -r "../${{ matrix.name }}.zip" .

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: out/${{ matrix.name }}.zip
          if-no-files-found: error

  release:
    name: 创建 GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - name: 下载构建产物
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: 生成 SHA-256 清单
        run: |
          cd artifacts
          find . -type f -name '*.zip' -print0 \
            | sort -z \
            | xargs -0 sha256sum > SHA256SUMS
          cat SHA256SUMS

      - name: 上传 Release 资源
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="${GITHUB_REF_NAME}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag 已存在，覆盖资源"
          else
            gh release create "$tag" --title "$tag" --generate-notes
          fi
          find artifacts -type f -name '*.zip' -print0 \
            | xargs -0 -n1 gh release upload "$tag" --clobber
          gh release upload "$tag" artifacts/SHA256SUMS --clobber
