name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "true"

jobs:
  verify:
    name: 发布前构建与测试
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: whalepod_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d whalepod_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      WHALEPOD_TEST_DB_CONNECTION: "Host=127.0.0.1;Port=5432;Database=whalepod_test;Username=postgres;Password=postgres"
      # GitHub Actions service containers expose the database through Docker NAT.
      WHALEPOD_TEST_ALLOW_NON_LOOPBACK: "true"
    steps:
      - name: 检出代码
        uses: actions/checkout@v4.4.0

      - name: 初始化测试数据库扩展
        shell: bash
        run: |
          container=$(docker ps --format '{{.ID}} {{.Image}}' | awk '$2 ~ /postgres/ {print $1; exit}')
          test -n "$container"
          docker exec "$container" psql -U postgres -d whalepod_test -c "CREATE EXTENSION IF NOT EXISTS citext;"

      - name: 安装 .NET SDK
        uses: actions/setup-dotnet@v4.3.1
        with:
          dotnet-version: "10.0.401"
          cache: true
          cache-dependency-path: |
            **/*.csproj
            Directory.Build.props
            global.json

      - name: 还原依赖
        run: dotnet restore WhalePod.slnx --locked-mode

      - name: 构建
        run: dotnet build WhalePod.slnx -c Release --no-restore

      - name: 格式检查
        run: dotnet format WhalePod.slnx --verify-no-changes --no-restore

      - name: 运行测试
        run: dotnet test WhalePod.slnx -c Release --no-build --logger trx --results-directory TestResults

      - name: 校验数据库/HTTP 集成测试未跳过
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import glob
          import sys
          import xml.etree.ElementTree as ET

          files = glob.glob("TestResults/**/*.trx", recursive=True)
          if not files:
              sys.exit("No TRX files found; tests did not run.")

          results = []
          for path in files:
              root = ET.parse(path).getroot()
              for element in root.iter():
                  if element.tag.endswith("UnitTestResult"):
                      results.append((element.get("testName") or "", element.get("outcome") or ""))

          skipped = [name for name, outcome in results if outcome in {"NotExecuted", "Skipped"}]
          if skipped:
              print("Skipped tests are not allowed when PostgreSQL is provisioned:", *skipped, sep="\n  ")
              sys.exit(1)
          if not results:
              sys.exit("No test results were recorded.")
          print(f"{len(results)} tests executed, 0 skipped.")
          PY

      - name: 上传测试结果
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: release-test-results
          path: TestResults/**/*.trx
          if-no-files-found: ignore

  container:
    name: 构建容器镜像
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 检出代码
        uses: actions/checkout@v4.4.0

      - name: 构建 Web/API/迁移镜像
        run: |
          docker build -f deploy/Dockerfile --target web -t whalepod-web:ci .
          docker build -f deploy/Dockerfile --target api -t whalepod-api:ci .
          docker build -f deploy/Dockerfile --target migrate -t whalepod-migrate:ci .
          docker image inspect whalepod-web:ci --format '{{.Id}}' > web-image-id.txt
          docker image inspect whalepod-api:ci --format '{{.Id}}' > api-image-id.txt
          docker image inspect whalepod-migrate:ci --format '{{.Id}}' > migrate-image-id.txt

      - name: 上传镜像 ID 证据
        uses: actions/upload-artifact@v4.6.2
        with:
          name: container-image-ids
          path: "*-image-id.txt"
          if-no-files-found: error

  publish:
    name: 发布 ${{ matrix.name }}
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: whalepod-web-linux-x64
            project: src/WhalePod.Web/WhalePod.Web.csproj
            rid: linux-x64
            self_contained: false
            single_file: false
          - name: whalepod-api-linux-x64
            project: src/WhalePod.Api/WhalePod.Api.csproj
            rid: linux-x64
            self_contained: false
            single_file: false
          - name: whalepod-device-win-x64
            project: src/WhalePod.DeviceCli/WhalePod.DeviceCli.csproj
            rid: win-x64
            self_contained: true
            single_file: true
          - name: whalepod-device-linux-x64
            project: src/WhalePod.DeviceCli/WhalePod.DeviceCli.csproj
            rid: linux-x64
            self_contained: true
            single_file: true
          - name: whalepod-device-osx-arm64
            project: src/WhalePod.DeviceCli/WhalePod.DeviceCli.csproj
            rid: osx-arm64
            self_contained: true
            single_file: true
    steps:
      - name: 检出代码
        uses: actions/checkout@v4.4.0

      - name: 安装 .NET SDK
        uses: actions/setup-dotnet@v4.3.1
        with:
          dotnet-version: "10.0.401"
          cache: true
          cache-dependency-path: |
            **/*.csproj
            Directory.Build.props
            global.json

      - name: 发布
        run: >
          dotnet publish "${{ matrix.project }}"
          -c Release
          -r "${{ matrix.rid }}"
          --self-contained "${{ matrix.self_contained }}"
          -p:PublishSingleFile="${{ matrix.single_file }}"
          -p:DebugType=None
          -p:DebugSymbols=false
          -o "out/${{ matrix.name }}"

      - name: 打包
        run: |
          cd "out/${{ matrix.name }}"
          zip -r "../${{ matrix.name }}.zip" .

      - name: 上传构建产物
        uses: actions/upload-artifact@v4.6.2
        with:
          name: ${{ matrix.name }}
          path: out/${{ matrix.name }}.zip
          if-no-files-found: error

  release:
    name: 创建 GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - name: 下载构建产物
        uses: actions/download-artifact@v4.3.0
        with:
          path: artifacts

      - name: 生成 SHA-256 清单与来源记录
        run: |
          cd artifacts
          echo "${GITHUB_SHA}" > COMMIT_SHA
          find . -type f -name '*.zip' -print0 \
            | sort -z \
            | xargs -0 sha256sum > SHA256SUMS
          cat COMMIT_SHA
          cat SHA256SUMS

      - name: 上传 Release 资源
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="${GITHUB_REF_NAME}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag 已存在，覆盖资源"
          else
            gh release create "$tag" --title "$tag" --generate-notes
          fi
          find artifacts -type f -name '*.zip' -print0 \
            | xargs -0 -n1 gh release upload "$tag" --clobber
          gh release upload "$tag" artifacts/SHA256SUMS artifacts/COMMIT_SHA --clobber
