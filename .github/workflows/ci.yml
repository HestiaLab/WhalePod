name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "true"
  WHALEPOD_TEST_DB_CONNECTION: "Host=127.0.0.1;Port=5432;Database=whalepod_test;Username=postgres;Password=postgres"

jobs:
  build-test:
    name: 构建、格式检查与测试
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: whalepod_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d whalepod_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
          cache: true
          cache-dependency-path: |
            **/*.csproj
            Directory.Build.props
            global.json

      - name: 还原依赖
        run: dotnet restore WhalePod.slnx

      - name: 构建
        run: dotnet build WhalePod.slnx -c Release --no-restore

      - name: 格式检查
        run: dotnet format WhalePod.slnx --verify-no-changes --no-restore

      - name: 运行测试
        run: dotnet test WhalePod.slnx -c Release --no-build --logger trx --results-directory TestResults

      - name: 校验数据库/HTTP 集成测试未跳过
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import glob
          import sys
          import xml.etree.ElementTree as ET

          files = glob.glob("TestResults/**/*.trx", recursive=True)
          if not files:
              sys.exit("No TRX files found; tests did not run.")

          results = []
          for path in files:
              root = ET.parse(path).getroot()
              for element in root.iter():
                  if element.tag.endswith("UnitTestResult"):
                      results.append((element.get("testName") or "", element.get("outcome") or ""))

          skipped = [name for name, outcome in results if outcome in {"NotExecuted", "Skipped"}]
          if skipped:
              print("Skipped tests are not allowed when PostgreSQL is provisioned:", *skipped, sep="\n  ")
              sys.exit(1)
          if not results:
              sys.exit("No test results were recorded.")
          print(f"{len(results)} tests executed, 0 skipped.")
          PY

      - name: 上传测试结果
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults/**/*.trx
          if-no-files-found: ignore
