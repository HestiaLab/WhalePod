name: Pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: 部署静态项目介绍
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4.4.0

      - name: 配置 Pages
        uses: actions/configure-pages@v4.0.0

      - name: 上传静态站点
        uses: actions/upload-pages-artifact@v4.0.0
        with:
          path: site

      - name: 部署
        id: deployment
        uses: actions/deploy-pages@v4.0.5
